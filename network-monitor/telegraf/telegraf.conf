[agent]
  interval = "5s"
  round_interval = true
  flush_interval = "5s"
  flush_jitter = "1s"
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  precision = ""
  debug = false
  quiet = false
  logfile = ""
  hostname = "windows-raw-probe"
  omit_hostname = true

[[outputs.influxdb_v2]]
  urls = ["http://127.0.0.1:8086"]
  token = "kO8Adahm2f6iCnUrJs0b7yvWBu4PjDRHepVMNwQ5EFtYxLZTz3XIcqGSoK1gl9"
  organization = "home"
  bucket = "network"

[[inputs.ping]]
  # 分层探测目标，按“由内到外”的链路顺序排列
  urls = [
    "192.168.31.1",    # 小米 Redmi AX1800 路由 LAN，内网第一跳
    "192.168.1.1",     # 光猫管理地址，内网第二跳
    # "100.84.36.1",   # 旧运营商首跳（2026-09-29 部署时有效，现已不在路径上，保留备查）
    "100.69.56.1",     # @cgnat-hop 运营商 CGNAT 接入网关，当前运营商侧首跳（2026-10-31 实测生效；此行由 update-cgnat-hop.ps1 自动维护）
    # 运营商骨干跳点已不再纳入 ping 监测，原因见本节末尾说明
    # "222.72.237.93",  # 旧电信公网跳点（2026-09-29 部署时有效，现已无响应，保留备查）
    # "222.72.236.233", # 电信公网骨干跳点（2026-10-31 实测可响应，但 ECMP 漂移 + ICMP 限速，不适合监测）
    "223.5.5.5",       # 阿里公共 DNS
    "119.29.29.29",    # 腾讯 DNSPod 公共 DNS
    "8.8.8.8",         # Google 公共 DNS
    "1.1.1.1",         # Cloudflare 公共 DNS
  ]

  # ── 为什么不再监控运营商骨干跳点（222.72.x / 61.152.x / 61.172.x 等）──
  # 1) 它们不是“出口 IP”，只是沿途路由器的接口地址（过路节点）；
  #    你的流量走这些设备的转发面，与其管理面的 ICMP 响应没有关系
  # 2) 同一条链路有多台设备做 ECMP 负载分担，每次探测落到的 IP 都不同
  #    （实测同一目标连续 10 次 trace，出现 222.72.236.233 / .229 / 237.85，
  #     换一个目标还会变成 61.152.x / 61.172.x）
  # 3) 核心路由器普遍对 ICMP 限速，实测 10 次探测仅 3 次有响应，其余超时
  #    → 数据断断续续，既不能反映真实质量，也无法作为告警依据
  # 结论：运营商侧只保留稳定的 CGNAT 接入网关（100.64.0.0/10 段）作为锚点，
  #       更外侧的公网质量由下方稳定的 DNS 目标（223.5.5.5 等）代表；
  #       骨干路径如需观察，请用 tracert / PingPlotter / Best Trace 等路由追踪工具。
  count = 3
  ping_interval = 1.0
  timeout = 1.0
  deadline = 5
  method = "exec"
  binary = "ping"
  interface = ""
  percentiles = [50, 95, 99]
  name_override = "ping"

# ── 网络拓扑采集（traceroute）──
# 调用 topology-probe.ps1，对 4 个公网目标各跑一次 tracert，
# 把每一跳（跳数 + 该跳 IP + 平均 RTT）写成 InfluxDB line protocol。
# 用途：在 Grafana 里画出"当前路径拓扑"，看清楚流量到底经过哪些设备。
# 说明：这份数据只做"路径观测"，不做质量告警（骨干 ICMP 限速/ECMP 漂移，
#       原因见上方 ping 段说明）。未响应的跳点 addr="*"、rtt_ms=-1.00。
[[inputs.exec]]
  commands = [['powershell.exe', '-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass', '-File', 'd:\trae_works\20260926\network-monitor\telegraf\topology-probe.ps1']]
  interval = "5m"
  timeout = "120s"
  data_format = "influx"
